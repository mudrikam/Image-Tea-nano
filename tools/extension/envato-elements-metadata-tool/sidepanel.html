<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Envato Elements Mockup Metadata Tool</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-mark">
        <img src="icons/envato-48.png" alt="Envato">
      </div>
      <div class="brand-copy">
        <h1>Image Tea Connection</h1>
        <p>Envato metadata bridge</p>
      </div>
      <span class="connection-dot" title="Side panel active"></span>
    </header>

    <main class="workspace">
      <section class="connection-section card">
        <div class="section-heading">
          <div>
            <h2>Connection Settings</h2>
            <p>Connect this Chrome profile to the running Image Tea app.</p>
          </div>
          <span class="format-badge">LOCAL</span>
        </div>
        <div class="connection-form">
          <label for="port">Application port</label>
          <div class="port-row">
            <input id="port" type="number" min="1024" max="65535" value="8765">
            <button id="connect" class="button button-primary" type="button">Connect</button>
          </div>
        </div>
        <div class="status-card">
          <span class="status-pulse"></span>
          <p id="status" class="status">Not connected</p>
        </div>
      </section>

      <section class="logs-section card">
        <div class="logs-heading">
          <div class="logs-title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 9h16M4 13h10M4 17h7"/></svg>
            <h2>Activity Logs</h2>
          </div>
          <span class="live-label"><i></i> Live</span>
        </div>
        <pre id="log" class="log" aria-live="polite"></pre>
      </section>
    </main>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
