<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Envato Elements Mockup Metadata Tool</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-mark">
        <img src="icons/envato-48.png" alt="Envato">
      </div>
      <div class="brand-copy">
        <h1>Envato Mockup Metadata</h1>
        <p>Human-like form filler</p>
      </div>
      <span class="connection-dot" title="Side panel active"></span>
    </header>

    <main class="workspace">
      <section class="editor-section">
        <div class="section-heading">
          <div>
            <h2>JSON Metadata</h2>
            <p>Paste the metadata generated by Image Tea.</p>
          </div>
          <span class="format-badge">JSON</span>
        </div>
        <textarea id="metadata" spellcheck="false" placeholder="Paste the generated JSON here..."></textarea>
      </section>

      <section class="controls-section">
        <div class="actions">
          <button id="paste" class="button button-secondary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h6m-5-2h4a1 1 0 0 1 1 1v2H9V4a1 1 0 0 1 1-1Zm-1 2H7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-1M8 12h8m-8 4h5"/></svg>
            <span>Paste JSON</span>
          </button>
          <button id="clear" class="button button-clear" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16m-10 4v6m4-6v6M9 7V4h6v3m-9 0 1 13h8l1-13"/></svg>
            <span>Clear</span>
          </button>
          <button id="fill" class="button button-primary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5M4 5h5"/></svg>
            <span>Fill Envato Form</span>
          </button>
        </div>
        <p id="status" class="status">Open an Envato Elements contributor page.</p>
      </section>

      <section class="logs-section">
        <div class="logs-heading">
          <div class="logs-title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 9h16M4 13h10M4 17h7"/></svg>
            <h2>Activity Logs</h2>
          </div>
          <span class="live-label"><i></i> Live</span>
        </div>
        <pre id="log" class="log" aria-live="polite"></pre>
      </section>
    </main>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
