<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Flow Batcher</title>
  <style>
    /* Elegant Dark CSS Theme */
    :root {
      --bg-main: #09090b;
      --bg-panel: #111318;
      --bg-section: #1a1d23;
      --bg-input: #09090b;
      --bg-hover: #383d47;
      --bg-highlight: #2a2f38;
      --border-color: #2d3139;
      --text-main: #e4e7eb;
      --text-muted: #9ca3af;
      --accent: #f27d26;
      --accent-hover: #ff8c3a;
      --success: #4ade80;
      --error: #f87171;
      --warning: #facc15;
      --font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      margin: 0;
      background-color: var(--bg-panel);
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-x: hidden;
    }
    /* Global scrollbar styling for WebKit browsers */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }
    /* Firefox scrollbar */
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) rgba(0, 0, 0, 0.2);
    }
    .header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header svg {
      color: var(--accent);
      width: 24px;
      height: 24px;
    }
    .header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }
    .header .title-group {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .header .version {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .badge {
      font-size: 10px;
      background-color: rgba(242, 125, 38, 0.1);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(242, 125, 38, 0.2);
      text-decoration: none !important;
      transition: all 0.2s;
      display: inline-block;
    }
    .badge-link {
      text-decoration: none !important;
    }
    .badge-link:hover .badge {
      background-color: rgba(242, 125, 38, 0.2);
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(242, 125, 38, 0.3);
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 0 0 8px 0;
      font-weight: 600;
      letter-spacing: 2px;
      display: block;
    }

    /* Controls Bar - Top Level */
    .controls-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }
    .btn-primary {
      flex: 1;
      padding: 10px 12px;
      background-color: var(--accent);
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 70px;
    }
    .btn-primary:hover { background-color: var(--accent-hover); }
    .btn-primary.btn-stop { background-color: var(--error); }
    .btn-primary.btn-stop:hover { background-color: #dc2626; }
    .btn-primary.btn-pause { background-color: var(--warning); color: #000; }
    .btn-primary.btn-pause:hover { background-color: #e6c235; }
    .btn-primary.btn-reset { background-color: var(--bg-hover); }
    .btn-primary.btn-reset:hover { background-color: var(--border-color); }
    .btn-secondary {
      padding: 10px 12px;
      background-color: var(--border-color);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
      font-size: 11px;
    }
    .btn-secondary:hover { background-color: var(--bg-hover); }
    .btn-secondary svg { width: 16px; height: 16px; }
    .btn-icon-only {
      width: 32px;
      height: 32px;
      padding: 0;
      min-width: 32px;
    }
    .hidden { display: none !important; }

    /* Input Files & Textarea */
    .file-drop-container {
      display: flex;
      gap: 8px;
    }
    .file-drop {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
      position: relative;
      background-color: var(--bg-section);
    }
    .file-drop:hover { border-color: var(--accent); background-color: var(--bg-hover); }
    .file-drop svg {
      width: 20px;
      height: 20px;
      margin: 0 auto 6px auto;
      color: var(--text-muted);
      display: block;
    }
    .file-drop p { margin: 0; font-size: 11px; color: var(--text-muted); }
    .file-drop input[type="file"] {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0; cursor: pointer; width: 100%;
    }
    .file-drop:hover { border-color: var(--accent); }
    .file-drop svg {
      width: 18px;
      height: 18px;
      margin: 0 auto 4px auto;
      color: var(--text-muted);
      display: block;
    }
    .file-drop p { margin: 0; font-size: 10px; color: var(--text-muted); }
    .file-drop input[type="file"] {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0; cursor: pointer; width: 100%;
    }
    .btn-upload {
      padding: 6px 12px;
      background-color: var(--border-color);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
      font-size: 10px;
      font-weight: 600;
      gap: 4px;
      height: 26px;
      white-space: nowrap;
    }
    .btn-upload:hover { background-color: var(--bg-hover); }

    /* Prompt Display Container (highlight individual prompts during automation) */
    .prompt-display-container {
      display: none;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      font-family: 'Consolas', 'Monaco', monospace;
      height: 200px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .prompt-display-container.visible {
      display: block;
    }
    .prompt-line {
      padding: 4px 8px;
      margin: 2px 0;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-word;
      transition: all 0.3s ease;
    }
    .prompt-line.prompt-pending {
      color: var(--text-muted);
      background: transparent;
    }
    .prompt-line.prompt-completed {
      color: #5a5a6a;
      background: rgba(30, 30, 40, 0.5);
      text-decoration: line-through;
      text-decoration-color: #4a4a5a;
    }
    .prompt-line.prompt-failed {
      color: var(--error);
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }
    .prompt-line.prompt-active {
      color: var(--accent);
      background: rgba(242, 125, 38, 0.15);
      border: 1px solid var(--accent);
      box-shadow: 0 0 15px rgba(242, 125, 38, 0.3), inset 0 0 10px rgba(242, 125, 38, 0.1);
      animation: prompt-glow 1.5s ease-in-out infinite;
    }
    @keyframes prompt-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(242, 125, 38, 0.3), inset 0 0 10px rgba(242, 125, 38, 0.1); }
      50% { box-shadow: 0 0 25px rgba(242, 125, 38, 0.5), inset 0 0 15px rgba(242, 125, 38, 0.2); }
    }

    textarea.manual-input {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text-main);
      font-size: 11px;
      outline: none;
      resize: vertical;
      box-sizing: border-box;
      font-family: inherit;
      min-height: 60px;
    }
    textarea.manual-input:focus { border-color: var(--accent); }
    textarea.manual-input.processing {
      background-color: var(--bg-highlight);
      border-color: var(--text-muted);
    }
    /* Custom scrollbar for textarea */
    textarea.manual-input::-webkit-scrollbar { width: 6px; }
    textarea.manual-input::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 3px; }
    textarea.manual-input::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    textarea.manual-input::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    select {
      width: 100%;
      padding: 6px 8px;
      background-color: var(--bg-section);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-main);
      font-size: 11px;
      outline: none;
      box-sizing: border-box;
    }
    select:focus { border-color: var(--accent); }
    .segmented {
      display: flex;
      background-color: var(--bg-section);
      border-radius: 4px;
      padding: 4px;
      gap: 0;
    }
    .segmented input { display: none; }
    .segmented label {
      flex: 1; text-align: center; font-size: 11px; padding: 4px 0;
      color: var(--text-muted); cursor: pointer; border-radius: 4px;
      transition: all 0.2s;
    }
    .segmented input:checked + label {
      background-color: var(--border-color);
      color: var(--text-main);
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .radio-group {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .radio-pill input { display: none; }
    .radio-pill label {
      display: block; padding: 4px 8px;
      background-color: var(--border-color); color: var(--text-main);
      border-radius: 4px; cursor: pointer; font-size: 10px;
      transition: background-color 0.2s;
    }
    .radio-pill label:hover { background-color: var(--bg-hover); }
    .radio-pill input:checked + label {
      background-color: var(--accent); color: #000; font-weight: bold;
    }
    .radio-pill.disabled label {
      opacity: 0.4; cursor: not-allowed; pointer-events: none;
    }
    .tracker-box {
      background-color: var(--bg-section); border: 1px solid var(--border-color);
      border-radius: 8px; padding: 12px;
    }
    .tracker-header {
      display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px;
    }
    .tracker-label { font-size: 11px; color: var(--text-muted); }
    .tracker-val { color: #fff; font-family: monospace; }
    .tracker-pct { font-size: 10px; font-weight: bold; color: var(--accent); }
    .progress-container {
      width: 100%; height: 6px; background-color: var(--bg-main);
      border-radius: 3px; overflow: hidden; margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%; background-color: var(--accent); width: 0%; transition: width 0.3s ease;
    }
    .tracker-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .stat-card {
      background-color: var(--bg-main); padding: 8px; border-radius: 4px;
    }
    .stat-label { display: block; font-size: 9px; color: var(--text-muted); text-transform: uppercase; }
    .stat-value { font-size: 12px; font-family: monospace; }
    .stat-success { color: var(--success); }
    .stat-failed { color: var(--error); }
    .stat-downloaded { color: #60a5fa; }

    /* Prompt Queue Table */
    .queue-table-container {
      background-color: var(--bg-section);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }
    .queue-table-wrapper {
      max-height: 200px;
      overflow-y: auto;
    }
    .queue-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    .queue-table th {
      background-color: var(--bg-main);
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      padding: 8px 10px;
      text-align: left;
      font-size: 9px;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
    }
    .queue-table td {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
      vertical-align: top;
    }
    .queue-table tr:last-child td { border-bottom: none; }
    .queue-table tr.processing {
      background-color: rgba(128, 128, 128, 0.15);
    }
    .queue-table tr.completed {
      background-color: rgba(74, 222, 128, 0.08);
    }
    .queue-table tr.failed {
      background-color: rgba(248, 113, 113, 0.08);
    }
    .queue-table tr.pending {
      background-color: transparent;
    }
    .queue-status {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 600;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .status-pending { background-color: var(--border-color); color: var(--text-muted); }
    .status-processing { background-color: var(--warning); color: #000; }
    .status-completed { background-color: var(--success); color: #000; }
    .status-failed { background-color: var(--error); color: #fff; }
    .queue-prompt-text {
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .empty-queue {
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 11px;
    }

    /* Log Area with Clear Button */
    .log-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 150px;
      position: relative;
    }
    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .log-clear-btn {
      width: 24px;
      height: 24px;
      padding: 0;
      min-width: 24px;
      font-size: 12px;
      border-radius: 3px;
    }
    .log-area {
      flex: 1;
      background-color: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow-y: auto;
      padding: 12px;
      font-family: monospace;
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .log-line { margin-bottom: 6px; word-break: break-all; }
    .log-time { color: #4b5563; margin-right: 6px; }
    .log-info { color: #60a5fa; }
    .log-success { color: var(--success); }
    .log-error { color: var(--error); }
    .log-warn { color: var(--warning); }
    .log-act { color: var(--accent); }
    /* Custom scrollbar for log area */
    .log-area::-webkit-scrollbar { width: 6px; }
    .log-area::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 3px; }
    .log-area::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    .log-area::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* Tracker/Stats */
    .tracker-box {
      background-color: var(--bg-section);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
    }
    .tracker-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 8px;
    }
    .tracker-label { font-size: 11px; color: var(--text-muted); }
    .tracker-val { color: #fff; font-family: monospace; }
    .tracker-pct { font-size: 10px; font-weight: bold; color: var(--accent); }
    .progress-container {
      width: 100%; height: 6px; background-color: var(--bg-main);
      border-radius: 3px; overflow: hidden; margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%; background-color: var(--accent); width: 0%; transition: width 0.3s ease;
    }
    .tracker-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .stat-card {
      background-color: var(--bg-main); padding: 8px; border-radius: 4px;
    }
    .stat-label { display: block; font-size: 9px; color: var(--text-muted); text-transform: uppercase; }
    .stat-value { font-size: 12px; font-family: monospace; }
    .stat-success { color: var(--success); }
    .stat-failed { color: var(--error); }
    .stat-downloaded { color: #60a5fa; }

    /* Landing Page Styles */
    .landing-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .landing-content {
      text-align: center;
      max-width: 280px;
    }
    .landing-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .landing-logo img {
      width: 80px;
      height: auto;
      filter: drop-shadow(0 0 12px rgba(242, 125, 38, 0.6));
    }
    .landing-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
    }
    .landing-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0 0 24px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .btn-large {
      padding: 14px 28px;
      font-size: 14px;
      width: 100%;
      max-width: 240px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
    <header class="header">
       <div class="header-left">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <div class="title-group">
          <h1>Auto Flow Batcher</h1>
          <span class="version" id="extensionVersion"></span>
        </div>
      </div>
      <a href="https://chat.whatsapp.com/CMQvDxpCfP647kBBA6dRn3" target="_blank" class="badge-link">
        <span class="badge">Desainia Studio</span>
      </a>
    </header>

    <!-- Landing Page (shown when not on Flow) -->
    <div id="landingPage" class="landing-page hidden">
      <div class="landing-content">
        <div class="landing-logo">
          <img src="icons/logo_128.png" alt="Auto Flow Batcher Logo">
        </div>
        <h2 class="landing-title">Desainia Studio</h2>
        <p class="landing-subtitle">Auto Flow Batcher</p>
        <button id="btnOpenFlow" class="btn-primary btn-large">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 8px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
          </svg>
          Open Flow
        </button>
      </div>
    </div>

     <!-- Main Interface (shown when on Flow) -->
     <div id="mainInterface" class="content">
      <!-- Controls Bar - Top -->
      <section class="controls-bar">
         <button class="btn-primary" id="btnStart" title="Start processing">
           <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
             <path d="M8 5v14l11-7z"/>
           </svg>
           <span class="btn-label">Start</span>
         </button>
        <button class="btn-primary btn-pause hidden" id="btnPause" title="Pause processing">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
          Pause
        </button>
        <button class="btn-primary btn-stop hidden" id="btnStop" title="Stop processing">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 6h12v12H6z"/>
          </svg>
          Stop
        </button>
        <button class="btn-primary btn-reset" id="btnReset" title="Reset all to default">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          Reset
        </button>
      </section>

      <!-- Configuration -->
      <section>
        <div class="config-grid">
          <div>
            <label class="section-title">Generation Type</label>
            <div class="segmented" id="typeGroup">
              <input type="radio" name="type" id="typeImage" value="image" checked><label for="typeImage">Image</label>
              <input type="radio" name="type" id="typeVideo" value="video"><label for="typeVideo">Video</label>
            </div>
          </div>
        </div>

        <div>
          <label class="section-title">Aspect Ratio</label>
          <div class="radio-group" id="ratioGroup">
            <div class="radio-pill"><input type="radio" name="ratio" id="r169" value="16:9" data-valid-for="image,video" checked><label for="r169">16:9</label></div>
            <div class="radio-pill"><input type="radio" name="ratio" id="r43" value="4:3" data-valid-for="image"><label for="r43">4:3</label></div>
            <div class="radio-pill"><input type="radio" name="ratio" id="r11" value="1:1" data-valid-for="image"><label for="r11">1:1</label></div>
            <div class="radio-pill"><input type="radio" name="ratio" id="r34" value="3:4" data-valid-for="image"><label for="r34">3:4</label></div>
            <div class="radio-pill"><input type="radio" name="ratio" id="r916" value="9:16" data-valid-for="image,video"><label for="r916">9:16</label></div>
          </div>
        </div>

        <div style="margin-top: 12px;">
          <label class="section-title">Batch Count</label>
          <div class="radio-group" id="batchGroup">
            <div class="radio-pill"><input type="radio" name="batch" id="b1" value="1"><label for="b1">x1</label></div>
            <div class="radio-pill"><input type="radio" name="batch" id="b2" value="2"><label for="b2">x2</label></div>
            <div class="radio-pill"><input type="radio" name="batch" id="b3" value="3"><label for="b3">x3</label></div>
            <div class="radio-pill"><input type="radio" name="batch" id="b4" value="4" checked><label for="b4">x4</label></div>
          </div>
        </div>
      </section>

      <!-- Prompt Input Section -->
      <section>
        <label class="section-title">Prompt Input</label>

        <!-- Load buttons row (small, sebaris) -->
        <div style="display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
          <button class="btn-upload" id="btnLoadTXT" title="Load TXT file">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 4px;">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
            Load TXT
          </button>
          <button class="btn-upload" id="btnLoadCSV" title="Load CSV file">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 4px;">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
            Load CSV
          </button>
          <button class="btn-upload" id="btnPaste" title="Paste prompt from clipboard">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 4px;">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            Paste
          </button>
          <button class="btn-upload" id="btnClearInput" title="Clear all prompts" style="background-color: var(--error);">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 4px;">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            Clear
          </button>
        </div>

        <!-- File drop area (full width) -->
        <div class="file-drop" id="fileDropArea" style="margin-bottom: 8px;">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          <p id="fileLabel">Drop .TXT or .CSV here, or click to upload</p>
          <input type="file" id="fileInput" accept=".txt,.csv">
        </div>

        <!-- Manual input textarea - larger -->
        <textarea id="manualInput" class="manual-input" rows="5" placeholder="Type prompts manually (one per line, or numbered format:&#10;1. first prompt&#10;2. second prompt&#10;&#10;Blank lines separate groups)"></textarea>

        <!-- Prompt display container (shown during processing) -->
        <div id="promptDisplay" class="prompt-display-container"></div>
      </section>

       <!-- Prompt Queue Table -->
       <section>
         <label class="section-title">Prompt Queue: <span id="queueProgress">0/0</span> <span id="queueRemaining" style="font-weight:normal;font-size:9px;color:var(--text-muted)"></span></label>
         <div class="queue-table-container">
           <div class="queue-table-wrapper">
            <table class="queue-table">
              <thead>
                <tr>
                  <th style="width: 40px;">#</th>
                  <th>Prompt</th>
                  <th style="width: 90px;">Status</th>
                  <th style="width: 100px;">Generated</th>
                </tr>
              </thead>
              <tbody id="queueTableBody">
                <tr>
                  <td colspan="4" class="empty-queue">No prompts in queue</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Tracker/Stats -->
      <section class="tracker-box">
        <div class="tracker-header">
          <span class="tracker-label">Processing: <span class="tracker-val" id="valQueue">0 / 0</span></span>
          <span class="tracker-pct" id="valPct">0%</span>
        </div>
        <div class="progress-container">
          <div class="progress-fill" id="progressBar"></div>
        </div>
        <div class="tracker-grid">
          <div class="stat-card">
            <span class="stat-label">Success</span>
            <span class="stat-value stat-success" id="valSuccess">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Failed</span>
            <span class="stat-value stat-failed" id="valFailed">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Downloaded</span>
            <span class="stat-value stat-downloaded" id="valDownloaded">0</span>
          </div>
        </div>
        <!-- Countdown Timer (shown during generation) -->
        <div id="countdownRow" class="hidden" style="margin-top: 8px; text-align: center;">
          <span class="tracker-label">Next prompt in: <span class="tracker-val" id="valCountdown" style="color: var(--accent);">--</span>s</span>
        </div>
      </section>

      <!-- System Log -->
      <section class="log-container">
        <div class="log-header">
          <label class="section-title" style="margin: 0;">System Log</label>
          <button class="btn-secondary btn-clear-log" id="btnClearLogs" title="Clear Logs" style="width: 24px; height: 24px; padding: 0; min-width: 24px;">
            <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        </div>
        <div class="log-area" id="logArea"></div>
      </section>
    </div>

    <script src="sidepanel.js"></script>
</body>
</html>
