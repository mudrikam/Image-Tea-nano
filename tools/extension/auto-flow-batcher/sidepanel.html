<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Flow Batcher</title>
  <style>
    /* Elegant Dark CSS Theme */
    :root {
      --bg-main: #09090b;
      --bg-panel: #111318;
      --bg-section: #1a1d23;
      --bg-input: #09090b;
      --bg-hover: #383d47;
      --border-color: #2d3139;
      --text-main: #e4e7eb;
      --text-muted: #9ca3af;
      --accent: #f27d26;
      --accent-hover: #ff8c3a;
      --success: #4ade80; 
      --error: #f87171; 
      --warning: #facc15; 
      --font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      margin: 0;
      background-color: var(--bg-panel);
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-x: hidden;
    }
    .header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header svg {
      color: var(--accent);
      width: 24px;
      height: 24px;
    }
    .header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }
    .badge {
      font-size: 10px;
      background-color: rgba(242, 125, 38, 0.1);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(242, 125, 38, 0.2);
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 0 0 8px 0;
      font-weight: 600;
      letter-spacing: 2px;
      display: block;
    }
    /* Input Files & Textarea */
    .file-drop {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      position: relative;
      margin-bottom: 8px;
    }
    .file-drop:hover { border-color: var(--accent); }
    .file-drop svg {
      width: 20px;
      height: 20px;
      margin: 0 auto 6px auto;
      color: var(--text-muted);
      display: block;
    }
    .file-drop p { margin: 0; font-size: 11px; color: #9ca3af; }
    .file-drop input[type="file"] {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0; cursor: pointer; width: 100%;
    }
     textarea.manual-input {
       width: 100%;
       background-color: var(--bg-input);
       border: 1px solid var(--border-color);
       border-radius: 6px;
       padding: 8px 10px;
       color: var(--text-main);
       font-size: 11px;
       outline: none;
       resize: vertical;
       box-sizing: border-box;
       font-family: inherit;
     }
     textarea.manual-input:focus { border-color: var(--accent); }
     /* Custom scrollbar for textarea (matches log area) */
     textarea.manual-input::-webkit-scrollbar { width: 6px; }
     textarea.manual-input::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 3px; }
     textarea.manual-input::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
     textarea.manual-input::-webkit-scrollbar-thumb:hover { background: var(--accent); }
     
     .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    select {
      width: 100%;
      padding: 6px 8px;
      background-color: var(--bg-section);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-main);
      font-size: 11px;
      outline: none;
      box-sizing: border-box;
    }
    select:focus { border-color: var(--accent); }
    .segmented {
      display: flex;
      background-color: var(--bg-section);
      border-radius: 4px;
      padding: 4px;
      gap: 0;
    }
    .segmented input { display: none; }
    .segmented label {
      flex: 1; text-align: center; font-size: 11px; padding: 4px 0;
      color: var(--text-muted); cursor: pointer; border-radius: 4px;
      transition: all 0.2s;
    }
    .segmented input:checked + label {
      background-color: var(--border-color);
      color: var(--text-main);
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .radio-group {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
     .radio-pill input { display: none; }
     .radio-pill label {
       display: block; padding: 4px 8px;
       background-color: var(--border-color); color: var(--text-main);
       border-radius: 4px; cursor: pointer; font-size: 10px;
       transition: background-color 0.2s;
     }
     .radio-pill label:hover { background-color: var(--bg-hover); }
     .radio-pill input:checked + label {
       background-color: var(--accent); color: #000; font-weight: bold;
     }
     .radio-pill.disabled label {
       opacity: 0.4; cursor: not-allowed; pointer-events: none;
     }
    .tracker-box {
      background-color: var(--bg-section); border: 1px solid var(--border-color);
      border-radius: 8px; padding: 12px;
    }
    .tracker-header {
      display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px;
    }
    .tracker-label { font-size: 11px; color: #9ca3af; }
    .tracker-val { color: #fff; font-family: monospace; }
    .tracker-pct { font-size: 10px; font-weight: bold; color: var(--accent); }
    .progress-container {
      width: 100%; height: 6px; background-color: var(--bg-main);
      border-radius: 3px; overflow: hidden; margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%; background-color: var(--accent); width: 0%; transition: width 0.3s ease;
    }
    .tracker-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .stat-card {
      background-color: var(--bg-main); padding: 8px; border-radius: 4px;
    }
    .stat-label { display: block; font-size: 9px; color: #9ca3af; text-transform: uppercase; }
    .stat-value { font-size: 12px; font-family: monospace; }
    .stat-success { color: var(--success); }
    .stat-failed { color: var(--error); }
    .log-container { display: flex; flex-direction: column; flex: 1; min-height: 150px; }
    .log-area {
      flex: 1; background-color: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color);
      border-radius: 8px; overflow-y: auto; padding: 12px; font-family: monospace;
      font-size: 10px; color: #9ca3af; line-height: 1.5;
    }
    .log-line { margin-bottom: 6px; word-break: break-all; }
    .log-time { color: #4b5563; margin-right: 6px; }
    .log-info { color: #60a5fa; }
    .log-success { color: var(--success); }
    .log-error { color: var(--error); }
    .log-warn { color: var(--warning); }
    .log-act { color: var(--accent); }
    /* Custom scrollbar for log area */
    .log-area::-webkit-scrollbar { width: 6px; }
    .log-area::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 3px; }
    .log-area::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    .log-area::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    .footer {
      padding: 16px; background-color: var(--bg-section); border-top: 1px solid var(--border-color);
      display: flex; gap: 8px; flex-shrink: 0;
    }
    .btn-primary {
      flex: 1; padding: 12px; background-color: var(--accent); color: #000; border: none;
      border-radius: 4px; font-weight: 700; font-size: 12px; text-transform: uppercase;
      letter-spacing: 1px; cursor: pointer; transition: background-color 0.2s;
    }
    .btn-primary:hover { background-color: var(--accent-hover); }
    .btn-secondary {
      padding: 12px 16px; background-color: var(--border-color); color: #fff; border: none;
      border-radius: 4px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: background-color 0.2s;
    }
    .btn-secondary:hover { background-color: var(--bg-hover); }
    .hidden { display: none !important; }

    /* Landing Page Styles */
    .landing-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .landing-content {
      text-align: center;
      max-width: 280px;
    }
    .landing-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px auto;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(242, 125, 38, 0.3);
    }
    .landing-logo svg {
      width: 40px;
      height: 40px;
      color: #000;
    }
    .landing-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
    }
    .landing-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0 0 24px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .btn-large {
      padding: 14px 28px;
      font-size: 14px;
      width: 100%;
      max-width: 240px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
    <header class="header">
      <div class="header-left">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <h1>Auto Flow Batcher</h1>
      </div>
       <span class="badge">Desainia Studio</span>
    </header>

    <!-- Landing Page (shown when not on Flow) -->
    <div id="landingPage" class="landing-page hidden">
      <div class="landing-content">
        <div class="landing-logo">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <h2 class="landing-title">Desainia Studio</h2>
        <p class="landing-subtitle">Auto Flow Batcher</p>
        <button id="btnOpenFlow" class="btn-primary btn-large">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 8px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
          </svg>
          Open Flow
        </button>
      </div>
    </div>

    <!-- Main Interface (shown when on Flow) -->
    <div id="mainInterface" class="content">
      <section>
        <label class="section-title">Prompt Queue (<span id="totalPromptsLabel">0</span>)</label>
        <div class="file-drop">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          <p id="fileLabel">Upload .TXT or .CSV</p>
          <input type="file" id="fileInput" accept=".txt,.csv">
        </div>
        <textarea id="manualInput" class="manual-input" rows="3" placeholder="Or type prompts manually (one per line)..."></textarea>
      </section>

      <section>
        <div class="config-grid">
          <div>
            <label class="section-title">Generation Type</label>
            <div class="segmented" id="typeGroup">
              <input type="radio" name="type" id="typeImage" value="image" checked><label for="typeImage">Image</label>
              <input type="radio" name="type" id="typeVideo" value="video"><label for="typeVideo">Video</label>
            </div>
          </div>
          <div>
            <label class="section-title">Model Selection</label>
            <select id="modelSelect">
              <option value="Nano Banana 2">Nano Banana 2</option>
              <option value="Nano Banana Pro">Nano Banana Pro</option>
              <option value="Imagen 4">Imagen 4</option>
            </select>
          </div>
        </div>

        <div>
          <label class="section-title">Aspect Ratio</label>
          <div class="radio-group" id="ratioGroup">
            <div class="radio-pill"><input type="radio" name="ratio" id="r169" value="16:9" data-valid-for="image,video" checked><label for="r169">16:9</label></div>
            <div class="radio-pill"><input type="radio" name="ratio" id="r43" value="4:3" data-valid-for="image"><label for="r43">4:3</label></div>
            <div class="radio-pill"><input type="radio" name="ratio" id="r11" value="1:1" data-valid-for="image"><label for="r11">1:1</label></div>
            <div class="radio-pill"><input type="radio" name="ratio" id="r34" value="3:4" data-valid-for="image"><label for="r34">3:4</label></div>
            <div class="radio-pill"><input type="radio" name="ratio" id="r916" value="9:16" data-valid-for="image,video"><label for="r916">9:16</label></div>
          </div>
        </div>
        
        <div style="margin-top: 12px;">
          <label class="section-title">Batch Count</label>
          <div class="radio-group" id="batchGroup">
            <div class="radio-pill"><input type="radio" name="batch" id="b1" value="1"><label for="b1">x1</label></div>
            <div class="radio-pill"><input type="radio" name="batch" id="b2" value="2"><label for="b2">x2</label></div>
            <div class="radio-pill"><input type="radio" name="batch" id="b3" value="3"><label for="b3">x3</label></div>
            <div class="radio-pill"><input type="radio" name="batch" id="b4" value="4" checked><label for="b4">x4</label></div>
          </div>
        </div>
      </section>

      <section class="tracker-box">
        <div class="tracker-header">
          <span class="tracker-label">Processing: <span class="tracker-val" id="valQueue">0 / 0</span></span>
          <span class="tracker-pct" id="valPct">0%</span>
        </div>
        <div class="progress-container">
          <div class="progress-fill" id="progressBar"></div>
        </div>
        <div class="tracker-grid">
          <div class="stat-card">
            <span class="stat-label">Success</span>
            <span class="stat-value stat-success" id="valSuccess">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Failed</span>
            <span class="stat-value stat-failed" id="valFailed">0</span>
          </div>
        </div>
      </section>

      <section class="log-container">
        <label class="section-title">System Log</label>
        <div class="log-area" id="logArea"></div>
      </section>

      <footer class="footer">
        <button class="btn-primary" id="btnStart">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 8px; vertical-align: middle;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Start
        </button>
        <button class="btn-primary btn-stop hidden" id="btnStop" style="background-color: var(--error);">Stop</button>
        <button class="btn-secondary" id="btnClearLogs">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </footer>
    </div>

     <script src="sidepanel.js"></script>
</body>
</html>
