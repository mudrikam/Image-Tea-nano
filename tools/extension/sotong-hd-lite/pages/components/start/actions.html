<div class="card shadow-sm mb-3">
  <div class="card-body p-3">
    <!-- Output Folder -->
    <div class="mb-0">
      <label for="start-output-folder-path" class="form-label fw-semibold mb-1"><i class="fa-solid fa-folder-open me-1"></i>Save to:</label>
      <input type="text" id="start-output-folder-path" class="form-control form-control-sm" placeholder="Enter folder name (e.g. output)" autocomplete="off">
    </div>
  </div>
</div>

<!-- File Loading Progress Modal -->
<div class="modal fade" id="start-file-loading-modal" tabindex="-1" aria-labelledby="startFileLoadingModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="startFileLoadingModalLabel"><i class="fa-solid fa-spinner fa-spin me-1"></i>Loading Files</h5>
      </div>
      <div class="modal-body">
        <div class="text-center mb-3">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span>Processing files...</span>
            <span id="start-file-progress-text" class="fw-bold">0 files</span>
          </div>
          <div class="progress" style="height: 20px;">
            <div id="start-file-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%">
              <span id="start-file-progress-percentage">0%</span>
            </div>
          </div>
        </div>
        <div id="start-current-file-info" class="text-muted small">
          Scanning for files...
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="start-btn-cancel-file-loading" class="btn btn-secondary"><i class="fa-solid fa-xmark me-1"></i>Cancel</button>
      </div>
    </div>
  </div>
</div>
