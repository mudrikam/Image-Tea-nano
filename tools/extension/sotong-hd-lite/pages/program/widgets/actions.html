<div class="card shadow-sm mb-4">
  <div class="card-body d-flex align-items-center">
  <label for="output-folder-path" class="me-2 fw-semibold"><i class="fa-solid fa-folder-open me-1"></i>Save to:</label>
  <input type="text" id="output-folder-path" class="form-control me-3" style="max-width:350px;" placeholder="Enter folder name (e.g. output)" autocomplete="off">

  <label for="batch-size-spinner" class="me-2 fw-semibold"><i class="fa-solid fa-layer-group me-1"></i>Batch Size:</label>
    <input type="number" id="batch-size-spinner" class="form-control me-3" style="width:100px;" min="1" max="10000" value="10">

  <button id="btn-start-process" type="button" class="btn btn-success"><i class="fa-solid fa-play me-1"></i>Start Process</button>
  <button id="btn-stop-process" type="button" class="btn btn-danger" style="display: none;"><i class="fa-solid fa-stop me-1"></i>Stop Process</button>
  </div>
</div>

<!-- File Loading Progress Modal -->
<div class="modal fade" id="file-loading-modal" tabindex="-1" aria-labelledby="fileLoadingModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="fileLoadingModalLabel">Loading Files</h5>
      </div>
      <div class="modal-body">
        <div class="text-center mb-3">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span>Processing files...</span>
            <span id="file-progress-text" class="fw-bold">0 files</span>
          </div>
          <div class="progress" style="height: 20px;">
            <div id="file-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%">
              <span id="file-progress-percentage">0%</span>
            </div>
          </div>
        </div>
        <div id="current-file-info" class="text-muted small">
          Scanning for files...
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="btn-cancel-file-loading" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>
</div>
