name: Create Release ZIPs

on:
  release:
    types: [created, published]

permissions:
  contents: write

jobs:
  create-zips:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create ZIP files
        run: |
          # Create temporary directory for zipping
          mkdir -p temp_zip
          
          # Copy all files except .git directory
          rsync -av --exclude='.git' --exclude='temp_zip' ./ temp_zip/
          
          # Create all ZIP files with the same content
          cd temp_zip
          zip -r ../Image-Tea-nano.zip . -x "*.git*"
          zip -r ../Image_Tea_Portable.zip . -x "*.git*"
          zip -r ../Image_Tea_Windows.zip . -x "*.git*"
          zip -r ../Image_Tea_Linux.zip . -x "*.git*"
          zip -r ../Image_Tea_MacOS.zip . -x "*.git*"
          cd ..
      
      - name: Upload ZIP files to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Image-Tea-nano.zip
            Image_Tea_Portable.zip
            Image_Tea_Windows.zip
            Image_Tea_Linux.zip
            Image_Tea_MacOS.zip

      - name: Cleanup temporary files
        run: |
          rm -rf temp_zip Image-Tea-nano.zip Image_Tea_Portable.zip Image_Tea_Windows.zip Image_Tea_Linux.zip Image_Tea_MacOS.zip
